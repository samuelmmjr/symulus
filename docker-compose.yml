services:
  postgres:
    image: postgres:16-alpine
    container_name: symulus-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-symulus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-symulus}
      POSTGRES_DB: ${POSTGRES_DB:-symulus}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-symulus} -d ${POSTGRES_DB:-symulus}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
